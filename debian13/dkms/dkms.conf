PACKAGE_NAME="t1bridge-debian"
PACKAGE_VERSION="0.1.12"
# t1_cfgsel, apple_t1_ncm : t1bridge tels quels
# appletbdrm : + garde drm_dev_set_dma_dev (>= 6.16)
# uvcvideo : uvcvideo 6.12.113 + parsing H.264 T1 (patches t1bridge adaptés)
MAKE[0]="make KDIR=${kernel_source_dir} all"
CLEAN="make KDIR=${kernel_source_dir} clean"

BUILT_MODULE_NAME[0]="t1_cfgsel"
BUILT_MODULE_LOCATION[0]="t1-cfgsel"
DEST_MODULE_LOCATION[0]="/updates/dkms"

BUILT_MODULE_NAME[1]="appletbdrm"
BUILT_MODULE_LOCATION[1]="appletbdrm"
DEST_MODULE_LOCATION[1]="/updates/dkms"

BUILT_MODULE_NAME[2]="apple_t1_ncm"
BUILT_MODULE_LOCATION[2]="apple-t1-ncm"
DEST_MODULE_LOCATION[2]="/updates/dkms"

BUILT_MODULE_NAME[3]="uvcvideo"
BUILT_MODULE_LOCATION[3]="uvcvideo"
DEST_MODULE_LOCATION[3]="/updates/dkms"

AUTOINSTALL="yes"
