# Les caméras brutes de la T1 n'envoient que du H.264 : on les masque.
# La caméra utilisable est « FaceTime HD » (/dev/video10, service facetime-auto).
monitor.v4l2.rules = [
  {
    matches = [ { device.product.name = "~.*iBridge.*" } , { device.description = "~.*iBridge.*" } ]
    actions = { update-props = { device.disabled = true } }
  }
]
